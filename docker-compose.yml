services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: simple_reward
      MYSQL_USER: reward
      MYSQL_PASSWORD: reward
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ureward", "-preward"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
